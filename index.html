<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workset</title>
<!-- ---- analytics (GA4 + PostHog) ----
     운영 도메인(workset.my)에서만 로드한다. localhost·file://·Netlify 미리보기에서는 아무것도 로드하지 않는다.
     키가 비어 있거나 로드에 실패해도 런처 동작에는 영향이 없어야 한다 (모든 호출은 try/catch). -->
<script>
(function () {
  "use strict";

  // 두 값 모두 브라우저에 노출되는 공개 식별자라 저장소에 커밋해도 된다 (시크릿 아님).
  var POSTHOG_KEY = "phc_Bv5AMLBBPJhoeniaa28Ew4Xh7FvEDjhJgnShPikQGWhe"; // phc_... (PostHog > Project settings > Project token)
  var POSTHOG_HOST = "https://us.i.posthog.com";      // EU 리전이면 https://eu.i.posthog.com
  var GA4_ID = "G-LNX7M4ELMM";                         // G-... (GA4 > 관리 > 데이터 스트림)

  var enabled = /(^|\.)workset\.my$/.test(location.hostname);
  var usePH = enabled && /^phc_/.test(POSTHOG_KEY);
  var useGA = enabled && /^G-/.test(GA4_ID);

  if (usePH) {
    try {
      !function(t,e){var o,n,p,r;e.__SV||(window.posthog=e,e._i=[],e.init=function(i,s,a){function g(t,e){var o=e.split(".");2==o.length&&(t=t[o[0]],e=o[1]),t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}}(p=t.createElement("script")).type="text/javascript",p.crossOrigin="anonymous",p.async=!0,p.src=s.api_host.replace(".i.posthog.com","-assets.i.posthog.com")+"/static/array.js",(r=t.getElementsByTagName("script")[0]).parentNode.insertBefore(p,r);var u=e;for(void 0!==a?u=e[a]=[]:a="posthog",u.people=u.people||[],Object.defineProperty(u,"toString",{configurable:!0,enumerable:!0,writable:!0,value:function(t){var e="posthog";return"posthog"!==a&&(e+="."+a),t||(e+=" (stub)"),e}}),Object.defineProperty(u.people,"toString",{configurable:!0,enumerable:!0,writable:!0,value:function(){return u.toString(1)+".people (stub)"}}),o="init capture register register_once register_for_session unregister unregister_for_session getFeatureFlag getFeatureFlagResult isFeatureEnabled reloadFeatureFlags updateEarlyAccessFeatureEnrollment getEarlyAccessFeatures on onFeatureFlags onSessionId getSurveys getActiveMatchingSurveys renderSurvey canRenderSurvey getNextSurveyStep identify setPersonProperties group resetGroups setPersonPropertiesForFlags resetPersonPropertiesForFlags setGroupPropertiesForFlags resetGroupPropertiesForFlags reset get_distinct_id getGroups get_session_id get_session_replay_url alias set_config startSessionRecording stopSessionRecording sessionRecordingStarted captureException loadToolbar get_property getSessionProperty createPersonProfile opt_in_capturing opt_out_capturing has_opted_in_capturing has_opted_out_capturing clear_opt_in_out_capturing debug".split(" "),n=0;n<o.length;n++)g(u,o[n]);e._i.push([i,s,a])},e.__SV=1)}(document,window.posthog||[]);
      window.posthog.init(POSTHOG_KEY, {
        api_host: POSTHOG_HOST,
        defaults: "2026-05-30",
        // autocapture는 링크 href를 attr__href·$elements_chain으로 싣고 이 값은 속성 무시목록을 우회한다.
        // 런치 이벤트는 아래에서 직접 보내므로 끄는 쪽이 중복도 없고 주소 유출 여지도 없다.
        autocapture: false,
        // 설문 팝업이 포커스를 가져가면 Ctrl+Enter가 먹통이 된다 — 런처에는 띄우지 않는다.
        disable_surveys: true
      });
    } catch (err) { usePH = false; }
  }

  if (useGA) {
    try {
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { window.dataLayer.push(arguments); };
      window.gtag("js", new Date());
      window.gtag("config", GA4_ID);
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA4_ID;
      document.head.appendChild(s);
    } catch (err) { useGA = false; }
  }

  // 런처 코드가 부르는 단일 진입점. beacon=true는 직후에 페이지를 떠나는 경우(마지막 항목)에 쓴다.
  window.wsTrack = function (name, props, beacon) {
    props = props || {};
    if (usePH) {
      try {
        window.posthog.capture(name, props, beacon ? { send_instantly: true, transport: "sendBeacon" } : undefined);
      } catch (err) {}
    }
    if (useGA) {
      try {
        var p = {};
        for (var k in props) { if (Object.prototype.hasOwnProperty.call(props, k)) p[k] = props[k]; }
        if (beacon) p.transport_type = "beacon";
        window.gtag("event", name, p);
      } catch (err) {}
    }
  };
})();
</script>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1d23;
    --muted: #8b93a1;
    --line: #e2e5ea;
    --mark: #3d6ae0;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --fg: #e6e8ec;
      --muted: #767e8c;
      --line: #2a2e36;
      --mark: #7fa0ff;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 18vh 24px 40px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .wrap { max-width: 320px; margin: 0 auto; }

  ol {
    list-style: none;
    margin: 0 0 44px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  li { display: flex; align-items: baseline; gap: 12px; }

  .marker {
    width: 14px;
    flex: none;
    font-size: 12px;
    line-height: 1.6;
    color: var(--mark);
    text-align: center;
  }
  li.done .marker { color: var(--muted); }

  a {
    flex: 1;
    display: block;
    padding: 9px 10px;
    margin-left: -10px;
    border-radius: 5px;
    color: var(--fg);
    font-size: 17px;
    line-height: 1.4;
    text-decoration: none;
  }
  a:focus { outline: none; }
  li.current a { background: var(--line); }
  li.done a { color: var(--muted); }

  /* ---- 하단 안내 = 키캡 ---- */
  .hint {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }

  .cap {
    display: inline-block;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    line-height: 1.3;
    user-select: none;
  }
  .cap.pressed {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
    border-bottom-width: 1px;
    transform: translateY(1px);
  }
  .cap[hidden], .plus[hidden] { display: none; }
  .plus { font-size: 12px; color: var(--muted); }

  @keyframes cap-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    50% { transform: translateX(4px); }
    75% { transform: translateX(-2px); }
  }
  .cap.shake { animation: cap-shake 0.25s ease; }
  @media (prefers-reduced-motion: reduce) {
    .cap.shake { animation: none; border-color: var(--mark); color: var(--mark); }
  }
</style>
</head>
<body>
<div class="wrap">
  <ol id="apps"></ol>
  <div class="hint">
    <span class="cap" id="cap-mod">Ctrl</span>
    <span class="plus" id="plus">+</span>
    <span class="cap" id="cap-enter">Enter</span>
    <span id="hint-text">로 계속</span>
  </div>
</div>

<script>
(function () {
  "use strict";

  var APPS = [
    { name: "Claude", url: "https://claude.ai" },
    { name: "ChatGPT", url: "https://chatgpt.com" },
    { name: "Linear", url: "https://linear.app" }
  ];

  var LAST = APPS.length - 1;
  var IS_MAC = /Mac|iPod|iPhone|iPad/.test(navigator.platform || "") || /Mac OS X/.test(navigator.userAgent);
  var MOD_LABEL = IS_MAC ? "⌘" : "Ctrl";
  var STORE_KEY = "workset-progress";

  var listEl = document.getElementById("apps");
  var capMod = document.getElementById("cap-mod");
  var capEnter = document.getElementById("cap-enter");
  var plusEl = document.getElementById("plus");
  var hintText = document.getElementById("hint-text");

  var links = [];
  var done = APPS.map(function () { return false; });
  var current = 0;
  var resumed = false;             // sessionStorage에서 진행 상태를 복원해 이어서 시작했는지
  var startedAt = Date.now();

  /* ---------- 계측 (analytics가 없거나 실패해도 동작에 영향 없음) ---------- */

  function track(name, props, beacon) {
    try { if (window.wsTrack) window.wsTrack(name, props, beacon); } catch (err) {}
  }

  // 키보드로 활성화된 click은 detail이 0이다. Ctrl/⌘ 동반 여부로 네 가지로 나눈다.
  function openMethod(e) {
    var mod = e.ctrlKey || e.metaKey;
    if (e.detail === 0) return mod ? "mod_enter" : "enter";
    return mod ? "mod_click" : "click";
  }

  capMod.textContent = MOD_LABEL;

  /* ---------- 진행 상태 (sessionStorage — 저장 실패해도 동작에 영향 없음) ---------- */

  function save() {
    try { sessionStorage.setItem(STORE_KEY, JSON.stringify(done)); } catch (err) {}
  }

  function clearSaved() {
    try { sessionStorage.removeItem(STORE_KEY); } catch (err) {}
  }

  function restore() {
    var raw = null;
    try { raw = sessionStorage.getItem(STORE_KEY); } catch (err) { return; }
    if (!raw) return;

    var saved;
    try { saved = JSON.parse(raw); } catch (err) { return; }
    if (!Array.isArray(saved) || saved.length !== APPS.length) return;

    // 전부 연 상태로 돌아왔으면 새로 시작한다 — 다 채워진 화면은 할 일이 없다.
    if (saved.every(Boolean)) { clearSaved(); return; }
    done = saved.map(Boolean);
    resumed = done.some(Boolean);
  }

  function reset() {
    done = APPS.map(function () { return false; });
    clearSaved();
  }

  /* ---------- 렌더 ---------- */

  APPS.forEach(function (app, i) {
    var li = document.createElement("li");

    var marker = document.createElement("span");
    marker.className = "marker";

    var a = document.createElement("a");
    a.href = app.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.textContent = app.name;

    a.addEventListener("click", function (e) {
      var isLast = i === LAST;
      track("launch_item_opened", {
        position: i + 1,
        total: APPS.length,
        is_last: isLast,
        method: openMethod(e),
        app_name: app.name,
        resumed: resumed
      }, isLast);

      if (isLast) {
        // 배경 탭으로 열면 런처가 전경에 남는다. 현재 탭 이동은 팝업이 아니라 차단되지 않는다.
        e.preventDefault();
        done[i] = true;
        save();
        // 이동 직전이라 beacon으로 보낸다. 이동을 늦추지 않는다.
        track("launch_sequence_finished", {
          total: APPS.length,
          opened_count: done.filter(Boolean).length,
          all_opened: done.every(Boolean),
          elapsed_ms: Date.now() - startedAt,
          resumed: resumed
        }, true);
        location.href = app.url;
        return;
      }
      // 마지막이 아닌 항목은 네이티브 동작(배경 탭)을 그대로 통과시킨다 — preventDefault 금지.
      done[i] = true;
      save();
      focusLink(nextPending(i + 1));
    });

    a.addEventListener("focus", function () { current = i; render(); });

    li.appendChild(marker);
    li.appendChild(a);
    listEl.appendChild(li);
    links.push(a);
  });

  function render() {
    links.forEach(function (a, i) {
      var li = a.parentNode;
      var isCurrent = i === current;
      li.classList.toggle("done", done[i]);
      li.classList.toggle("current", isCurrent && !done[i]);
      li.querySelector(".marker").textContent = done[i] ? "✓" : (isCurrent ? "▶" : "");
    });

    // 마지막 항목 차례에는 키캡이 Enter 하나로 바뀐다 — 이 전환이 "이제 마지막"이라는 신호다.
    var finishing = current === LAST;
    capMod.hidden = finishing;
    plusEl.hidden = finishing;
    hintText.textContent = finishing ? "로 마무리" : "로 계속";
  }

  function nextPending(from) {
    var i;
    for (i = from; i < APPS.length; i++) { if (!done[i]) return i; }
    for (i = 0; i < APPS.length; i++) { if (!done[i]) return i; }
    return LAST;
  }

  function focusLink(i) {
    if (links[i]) links[i].focus();
  }

  /* ---------- 키 입력 ---------- */

  function setPressed(cap, on) { cap.classList.toggle("pressed", on); }

  function shakeMod() {
    capMod.classList.remove("shake");
    void capMod.offsetWidth; // 애니메이션 재시작용 리플로
    capMod.classList.add("shake");
    setTimeout(function () { capMod.classList.remove("shake"); }, 300);
  }

  document.addEventListener("keydown", function (e) {
    // D2. IME 가드 — 한글 조합 중에는 Enter를 IME가 확정용으로 가져간다.
    if (e.isComposing || e.keyCode === 229) return;
    // D1. 키 리피트 가드 — 누르고 있는 동안 반복 발생하는 keydown을 무시한다.
    if (e.repeat) return;

    if (e.key === "Control" || e.key === "Meta") { setPressed(capMod, true); return; }
    if (e.key !== "Enter") return;

    setPressed(capEnter, true);

    // Ctrl+Enter에는 절대 preventDefault를 걸지 않는다 — 걸면 링크가 열리지 않는다.
    if (e.ctrlKey || e.metaKey) return;

    var ae = document.activeElement;
    var idx = links.indexOf(ae);
    if (idx === LAST) return; // 마지막 항목은 단독 Enter로 마무리한다

    // 다른 컨트롤에 포커스가 있으면 그쪽 키보드 조작을 방해하지 않는다.
    var onPage = !ae || ae === document.body || ae === document.documentElement;
    if (idx === -1 && !onPage) return;

    e.preventDefault();
    shakeMod();
    // 단독 Enter 차단 = 조작법을 아직 몸에 익히지 못했다는 신호 (MIN-58 "학습 완료" 기준 보조 지표).
    track("bare_enter_blocked", { position: current + 1, total: APPS.length });
  }, false);

  document.addEventListener("keyup", function (e) {
    if (e.key === "Control" || e.key === "Meta") setPressed(capMod, false);
    if (e.key === "Enter") setPressed(capEnter, false);
  }, false);

  /* ---------- 포커스 유지 ---------- */
  /* 링크에서 포커스가 빠지면 Ctrl+Enter가 먹통이 된다. 항상 현재 항목으로 되돌린다. */

  document.addEventListener("focusout", function () {
    setTimeout(function () {
      var ae = document.activeElement;
      if (links.indexOf(ae) !== -1) return;
      if (ae && ae !== document.body && ae !== document.documentElement) return;
      if (!document.hasFocus()) return;
      focusLink(current);
    }, 0);
  }, false);

  window.addEventListener("blur", function () {
    setPressed(capMod, false);
    setPressed(capEnter, false);
  }, false);

  window.addEventListener("focus", function () {
    if (links.indexOf(document.activeElement) === -1) focusLink(current);
  }, false);

  window.addEventListener("pagehide", save, false);

  // 뒤로 가기로 되살아난 경우(bfcache)도 새로 연 것과 같게 맞춘다.
  window.addEventListener("pageshow", function (e) {
    if (!e.persisted) return;
    if (done.every(Boolean)) reset();
    resumed = done.some(Boolean);
    startedAt = Date.now();
    start();
  }, false);

  /* ---------- 시작 ---------- */

  function start() {
    current = nextPending(0);
    render();
    focusLink(current);
  }

  restore();
  start();
})();
</script>
</body>
</html>
